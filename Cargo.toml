[package]
name = "img-gen-via-svg-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server that renders SVG to raster images with absolute pixel sizes and full SVG feature fidelity"
repository = "https://github.com/derDere/img-gen-via-svg-mcp"
readme = "README.md"
default-run = "img-gen-via-svg-mcp"

[features]
default = ["icns", "png-optimize", "remote"]
icns = ["dep:icns"]
png-optimize = ["dep:oxipng"]
remote = ["dep:ureq"]
avif = ["image/avif"]

[dependencies]
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
fontdb = "0.24"
image = "0.25.10"
svgtypes = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
base64 = "0.23"
toml = "1"
log = "0.4"
roxmltree = "0.21"
flate2 = "1"
icns = { version = "0.5", optional = true }
oxipng = { version = "10", optional = true, default-features = false, features = ["parallel", "zopfli"] }
ureq = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
