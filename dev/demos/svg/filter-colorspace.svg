<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <title>The same blur in sRGB and in linearRGB, side by side</title>
  <defs>
    <filter id="srgb" color-interpolation-filters="sRGB" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="linear" color-interpolation-filters="linearRGB" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="240" height="240" fill="#000"/>
  <g>
    <rect x="15" y="30" width="90" height="80" fill="#ffffff" filter="url(#srgb)"/>
    <rect x="135" y="30" width="90" height="80" fill="#ffffff" filter="url(#linear)"/>
    <circle cx="60" cy="180" r="34" fill="#ff0000" filter="url(#srgb)"/>
    <circle cx="180" cy="180" r="34" fill="#ff0000" filter="url(#linear)"/>
  </g>
</svg>
