<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <title>feTurbulence fractalNoise as film grain, composited over a gradient</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/><stop offset="1" stop-color="#c46b3f"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="contrast">
        <feFuncA type="linear" slope="0.55" intercept="-0.12"/>
      </feComponentTransfer>
      <feComposite in="contrast" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="240" height="240" fill="url(#g)" filter="url(#grain)"/>
</svg>
