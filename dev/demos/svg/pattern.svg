<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <title>A pattern with its own viewBox, a patternTransform, and a filtered tile</title>
  <defs>
    <filter id="tileblur"><feGaussianBlur stdDeviation="0.6"/></filter>
    <pattern id="p" width="0.16" height="0.16" viewBox="0 0 10 10" patternTransform="rotate(20)">
      <rect width="10" height="10" fill="#22333b"/>
      <circle cx="5" cy="5" r="3" fill="#c6ac8f" filter="url(#tileblur)"/>
      <path d="M0 0 L10 10" stroke="#eae0d5" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="240" height="240" fill="#0a0908"/>
  <rect x="10" y="10" width="220" height="220" rx="16" fill="url(#p)"/>
</svg>
