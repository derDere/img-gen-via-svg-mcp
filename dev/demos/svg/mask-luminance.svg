<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <title>A luminance mask built from a gradient</title>
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/><stop offset="0.5" stop-color="#808080"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="m"><rect width="240" height="240" fill="url(#mg)"/></mask>
  </defs>
  <rect width="240" height="240" fill="#102a43"/>
  <g mask="url(#m)">
    <rect x="0" y="20" width="240" height="90" fill="#f0a202"/>
    <circle cx="120" cy="175" r="55" fill="#61dafb"/>
  </g>
</svg>
