<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <title>feConvolveMatrix with an emboss and a sharpen kernel</title>
  <defs>
    <filter id="emboss">
      <feConvolveMatrix order="3" kernelMatrix="-2 -1 0 -1 1 1 0 1 2" divisor="1" preserveAlpha="true"/>
    </filter>
    <filter id="sharpen">
      <feConvolveMatrix order="3" kernelMatrix="0 -1 0 -1 5 -1 0 -1 0" divisor="1" preserveAlpha="true"/>
    </filter>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef476f"/><stop offset="0.5" stop-color="#ffd166"/><stop offset="1" stop-color="#06d6a0"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="#22223b"/>
  <rect x="20" y="20" width="200" height="60" fill="url(#cg)"/>
  <rect x="20" y="90" width="200" height="60" fill="url(#cg)" filter="url(#emboss)"/>
  <rect x="20" y="160" width="200" height="60" fill="url(#cg)" filter="url(#sharpen)"/>
</svg>
