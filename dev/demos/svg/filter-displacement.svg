<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <title>feDisplacementMap driven by turbulence</title>
  <defs>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" seed="3" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="38" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" fill="#0d1117"/>
  <g filter="url(#warp)">
    <rect x="30" y="30" width="180" height="180" fill="none" stroke="#6ee7b7" stroke-width="8"/>
    <line x1="30" y1="120" x2="210" y2="120" stroke="#f472b6" stroke-width="8"/>
    <line x1="120" y1="30" x2="120" y2="210" stroke="#f472b6" stroke-width="8"/>
  </g>
</svg>
