<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <title>CSS beyond the resolved subset</title>
  <style>
    :root { --brand: #ff006e; }
    .box { fill: #8338ec; }
    @media (min-width: 1px) { .box { fill: #3a86ff; } }
    @supports (fill: red) { .alt { fill: var(--brand); } }
  </style>
  <rect width="240" height="240" fill="#f8f9fa"/>
  <rect class="box" x="20" y="20" width="90" height="90"/>
  <rect class="alt" x="130" y="20" width="90" height="90"/>
  <text x="20" y="160" font-family="DejaVu Sans" font-size="15" fill="#212529">left: class applies</text>
  <text x="20" y="185" font-family="DejaVu Sans" font-size="15" fill="#212529">right: custom property does not</text>
</svg>
