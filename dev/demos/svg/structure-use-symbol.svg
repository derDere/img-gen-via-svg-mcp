<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <title>use, symbol, a nested svg and switch with systemLanguage</title>
  <defs>
    <symbol id="badge" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="9" fill="#2a9d8f"/>
      <path d="M5 10 l3 3 l7 -7" stroke="#fff" stroke-width="2" fill="none"/>
    </symbol>
    <g id="tile"><rect width="40" height="40" fill="#e76f51"/><circle cx="20" cy="20" r="12" fill="#f4a261"/></g>
  </defs>
  <rect width="240" height="240" fill="#264653"/>
  <use id="badge-large" xlink:href="#badge" x="15" y="15" width="60" height="60"/>
  <use xlink:href="#badge" x="90" y="25" width="40" height="40"/>
  <use xlink:href="#tile" x="150" y="20"/>
  <use xlink:href="#tile" x="150" y="70" transform="rotate(15 170 90)"/>
  <svg x="20" y="110" width="200" height="110" viewBox="0 0 100 55">
    <rect width="100" height="55" fill="#e9c46a"/>
    <text x="6" y="34" font-family="DejaVu Sans" font-size="16" fill="#264653">nested svg</text>
  </svg>
  <switch>
    <text systemLanguage="zz" x="20" y="235" font-size="14" fill="#fff">never chosen</text>
    <text x="20" y="235" font-family="DejaVu Sans" font-size="14" fill="#a8dadc">switch fallback</text>
  </switch>
</svg>
